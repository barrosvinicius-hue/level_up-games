services:
  - type: web
    name: level-up-games
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@levelup.local
      - key: ADMIN_PASSWORD
        generateValue: true
