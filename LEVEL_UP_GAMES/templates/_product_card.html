<article class="product-card"><a href="{{ url_for('store.produto',produto_id=p.id) }}" class="product-image">
{% if p.imagem %}<img src="{{ p.imagem }}" alt="{{ p.nome }}" loading="lazy">{% else %}<div class="image-placeholder">LEVEL UP</div>{% endif %}
{% if p.destaque %}<span class="tag">DESTAQUE</span>{% endif %}</a><div class="product-info"><span class="product-platform">{{ p.plataforma }}</span><h3><a href="{{ url_for('store.produto',produto_id=p.id) }}">{{ p.nome }}</a></h3><div class="product-bottom"><strong>R$ {{ '%.2f'|format(p.preco)|replace('.',',') }}</strong><a class="add-mini" href="{{ url_for('store.produto',produto_id=p.id) }}">Ver produto ↗</a></div></div></article>
